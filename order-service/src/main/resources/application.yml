server:
  port: 8084

spring:
  application:
    name: ORDER-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/order_service
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Kunal@123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# BUG-05 FIX: JWT secret must match user-service to validate incoming tokens
jwt:
  secret: "mySuperSecretKeyForJwtGeneration1234567890"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

