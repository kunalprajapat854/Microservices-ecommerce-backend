name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SERVICES: >-
    api-gateway
    inventory-service
    order-service
    payment-service
    product-service
    service-registry
    user-service

jobs:
  # ------------------------------------------------------------------
  # 1. Secrets detection — runs first, fast, blocks everything downstream
  # ------------------------------------------------------------------
  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
        # Fails the job (non-zero exit) automatically if a secret is found

  # ------------------------------------------------------------------
  # 2. Build + unit test each service (matrix)
  # ------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - service-registry
          - user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & unit test
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B clean verify
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. SAST — SonarCloud static analysis (single combined project)
  # ------------------------------------------------------------------
  sonarqube:
    name: SAST (SonarCloud - combined)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for SonarCloud blame/history analysis
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test every service (generates classes + jacoco reports)
        run: |
          for svc in api-gateway inventory-service order-service payment-service product-service service-registry user-service; do
            echo "== $svc =="
            (cd "$svc" && ./mvnw -B clean test)
          done
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarCloud scan
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # reads sonar-project.properties at repo root
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------------------
  # 4. Build container images
  # ------------------------------------------------------------------
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - service-registry
          - user-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - name: Save image as artifact
        run: |
          docker save ${{ matrix.service }}:${{ github.sha }} -o ${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # 5. Container vulnerability scan — Trivy (blocks on CRITICAL/HIGH)
  # ------------------------------------------------------------------
  trivy-scan:
    name: Container Scan (Trivy - ${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - service-registry
          - user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
      - name: Load image
        run: docker load -i ${{ matrix.service }}.tar
      - name: Trivy scan (report, non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Archive scan report (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 90
      - name: Trivy gate (blocking - CRITICAL only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1' # fails the job -> blocks deploy gate below
          ignore-unfixed: true

  # ------------------------------------------------------------------
  # 6. Deployment gate — only reachable if every security check passed
  # ------------------------------------------------------------------
  deploy-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarqube, trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All security gates passed
        run: echo "Gitleaks, SonarQube and Trivy all passed - safe to deploy."
      # Add your actual deploy step(s) here (docker push, kubectl apply, etc.)
